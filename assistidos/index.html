<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistidos | Diário do que assisto</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css?v=0.1.1">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="app-header">
        <div class="app-header-inner">
            <div class="header-left">
                <a href="../" class="btn-icon" title="Voltar ao Painel Principal" aria-label="Voltar ao painel">
                    <i class="fa-solid fa-house"></i>
                </a>
                <div class="brand">
                    <span class="brand-icon"><i class="fa-solid fa-clapperboard"></i></span>
                    <div>
                        <h1>Assistidos</h1>
                        <p class="mono">diário do que assisto</p>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <span class="pill" id="contadorTotal">0 itens</span>
                <button type="button" class="btn btn-primary" id="btnNovo">
                    <i class="fa-solid fa-plus"></i> Novo
                </button>
            </div>
        </div>
    </header>

        <div id="avisoOffline" class="aviso-offline" hidden></div>
    <div id="resumo" class="resumo" hidden></div>
<main class="app-main">


        <!-- Filtros -->
        <section class="filtros">
            <div class="filtro-busca">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="busca" placeholder="Buscar por título..." autocomplete="off">
            </div>
            <select id="filtroTipo">
                <option value="">Todos os tipos</option>
                <option value="filme">Filme</option>
                <option value="serie">Série</option>
                <option value="anime">Anime</option>
                <option value="dorama">Dorama</option>
                <option value="documentario">Documentário</option>
            </select>
            <select id="filtroStatus">
                <option value="">Todos os status</option>
                <option value="assistindo">Assistindo</option>
                <option value="completo">Completo</option>
                <option value="pausado">Pausado</option>
                <option value="largado">Largado</option>
                <option value="quero_ver">Quero ver</option>
            </select>
            <select id="filtroNota">
                <option value="">Qualquer nota</option>
                <option value="5">★ 5</option>
                <option value="4">★ 4 ou mais</option>
                <option value="3">★ 3 ou mais</option>
                <option value="0">Sem nota</option>
            </select>
        </section>

        <!-- Cards -->
        <section>
            <div class="lista-header">
                <h2>Meu diário</h2>
                <span class="mono" id="contadorLista"></span>
            </div>
            <div id="cards" class="cards-grid"></div>
            <p id="vazio" class="vazio" hidden>
                <i class="fa-regular fa-folder-open"></i>
                Nenhum item encontrado com esses filtros.
            </p>
        </section>

    </main>

    <!-- Modal de cadastro/edição -->
    <div class="modal-overlay" id="modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
            <div class="modal-header">
                <h2 id="modalTitulo">Novo item</h2>
                <button type="button" class="btn-icon" id="btnFecharModal" aria-label="Fechar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="formItem" class="modal-body" novalidate>
                <input type="hidden" id="campoId">

                <div class="campo campo-full">
                    <label for="campoTitulo">Título *</label>
                    <input type="text" id="campoTitulo" required maxlength="120" placeholder="Ex: Breaking Bad">
                </div>

                <div class="campo">
                    <label for="campoTipo">Tipo</label>
                    <select id="campoTipo">
                        <option value="serie">Série</option>
                        <option value="filme">Filme</option>
                        <option value="anime">Anime</option>
                        <option value="dorama">Dorama</option>
                        <option value="documentario">Documentário</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="campoStatus">Status</label>
                    <select id="campoStatus">
                        <option value="assistindo">Assistindo</option>
                        <option value="completo">Completo</option>
                        <option value="pausado">Pausado</option>
                        <option value="largado">Largado</option>
                        <option value="quero_ver">Quero ver</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="campoTemporada">Temporada</label>
                    <input type="number" id="campoTemporada" min="0" max="99" placeholder="1">
                </div>

                <div class="campo">
                    <label for="campoEpAtual">Episódio atual</label>
                    <input type="number" id="campoEpAtual" min="0" placeholder="0">
                </div>

                <div class="campo">
                    <label for="campoEpTotal">Total de episódios</label>
                    <input type="number" id="campoEpTotal" min="0" placeholder="0">
                </div>

                <div class="campo">
                    <label for="campoNota">Nota (0 a 5)</label>
                    <select id="campoNota">
                        <option value="">Sem nota</option>
                        <option value="5">★★★★★ 5</option>
                        <option value="4">★★★★ 4</option>
                        <option value="3">★★★ 3</option>
                        <option value="2">★★ 2</option>
                        <option value="1">★ 1</option>
                        <option value="0">☆ 0</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="campoOnde">Onde assisti</label>
                    <input type="text" id="campoOnde" maxlength="40" placeholder="Netflix, Prime, cinema...">
                </div>

                <div class="campo campo-full">
                    <label for="campoComentario">Comentário</label>
                    <textarea id="campoComentario" rows="3" maxlength="500" placeholder="O que achou?"></textarea>
                </div>

                <p class="erro" id="erroForm" hidden></p>

                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Aviso flutuante (undo de remoção) -->
    <div class="toast" id="toast" hidden role="status" aria-live="polite">
        <span id="toastTexto"></span>
        <button type="button" id="toastDesfazer"><i class="fa-solid fa-rotate-left"></i> Desfazer</button>
    </div>


    <!-- Modal da senha de acesso (mesmo esquema do modulo limpeza) -->
    <div id="modalChaveAcesso" class="modal-chave" hidden>
        <form id="formChaveAcesso" onsubmit="confirmarChaveAcesso(event)">
            <h3><i class="fa-solid fa-lock"></i> Entrar</h3>
            <p id="chaveMensagem"></p>
            <label for="inputChaveAcesso">Senha</label>
            <input type="password" id="inputChaveAcesso" autocomplete="current-password" placeholder="sua senha">
            <p id="erroChave" hidden></p>
            <button type="submit">Entrar</button>
        </form>
    </div>
    <script src="js/main.js?v=0.6.3"></script>
</body>
</html>
